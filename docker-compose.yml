services:
  deepseek-harness:
    build: .
    container_name: deepseek-harness
    restart: unless-stopped
    command: "dsh web --port 3081 --host 0.0.0.0"
    environment:
      NODE_ENV: production
      OPENAI_API_BASE: 'http://9router:3000/v1'
      OPENAI_BASE_URL: 'http://9router:3000/v1'
      OPENAI_API_KEY: '${OPENAI_API_KEY:?}'
      OPENAI_MODEL: '${OPENAI_MODEL:?}'
    networks:
      - app-network
    # Coolify gestionará dominio + HTTPS automáticamente

networks:
  app-network:
    driver: bridge
