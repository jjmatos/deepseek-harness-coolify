services:
  deepseek-harness:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      OPENAI_API_BASE: http://9router:3000/v1
      OPENAI_BASE_URL: http://9router:3000/v1
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
    expose:
      - "9081"

  proxy:
    build:
      context: .
      dockerfile: nginx.Dockerfile
    restart: unless-stopped
    depends_on:
      - deepseek-harness
    expose:
      - "80"
