services:
  deepseek-harness:
    build: .
    container_name: deepseek-harness
    restart: unless-stopped
    environment:
      NODE_ENV: production
      OPENAI_API_BASE: 'http://9router:3000/v1'
      OPENAI_BASE_URL: 'http://9router:3000/v1'
      OPENAI_API_KEY: '${OPENAI_API_KEY:?}'
      OPENAI_MODEL: '${OPENAI_MODEL:?}'
    networks:
      - app-network
    expose:
      - "9081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s

  proxy:
    build:
      context: .
      dockerfile: nginx.Dockerfile
    container_name: deepseek-proxy
    restart: unless-stopped
    depends_on:
      deepseek-harness:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  app-network:
    driver: bridge
