services:
  deepseek-harness:
    build: .
    container_name: deepseek-harness
    restart: unless-stopped
    command: dsh web --port 3080
    ports:
      - "3080:3080"
    environment:
      NODE_ENV: production
      OPENAI_API_BASE: http://9router:3000/v1
      OPENAI_BASE_URL: http://9router:3000/v1
      OPENAI_API_KEY: ${OPENAI_API_KEY:?}
      OPENAI_MODEL: ${OPENAI_MODEL:?}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3080"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s
