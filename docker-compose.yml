services:
  deepseek-harness:
    build: .
    container_name: deepseek-harness
    restart: unless-stopped
    command: dsh web --port 3080
    environment:
      NODE_ENV: production
      OPENAI_API_BASE: http://9router:3000/v1
      OPENAI_BASE_URL: http://9router:3000/v1
      OPENAI_API_KEY: ${OPENAI_API_KEY:?}
      OPENAI_MODEL: ${OPENAI_MODEL:?}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3080"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s

  proxy:
    image: nginx:alpine
    container_name: deepseek-proxy
    restart: unless-stopped
    ports:
      - "3080:80"
    configs:
      - source: nginx_conf
        target: /etc/nginx/nginx.conf
    depends_on:
      - deepseek-harness
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  app-network:
    driver: bridge

configs:
  nginx_conf:
    file: ./nginx.conf
